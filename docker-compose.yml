
services:
  logman:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: logman
    restart: unless-stopped

    ports:
      - "50051:50051"
      - "8081:8081"

    volumes:
      - ./data/node1:/app/data/node1
      - ./data/node2:/app/data/node2
      - ./data/node3:/app/data/node3

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8081/ready
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

    stop_grace_period: 30s

    networks:
      - logman-network

  prometheus:
    image: prom/prometheus:latest
    container_name: logman-prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    depends_on:
      logman:
        condition: service_healthy

    networks:
      - logman-network

volumes:
  prometheus-data:

networks:
  logman-network:
    driver: bridge
